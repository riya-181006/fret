<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Vacations</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ececec;
    font-family: "Trebuchet MS", "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }

  .fb-root {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #ececec;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .fb-header {
    background: #1E9BF0;
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 16px 0;
    flex: none;
    z-index: 5;
    box-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .fb-toprow {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .fb-iconbtn {
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
  }
  .fb-profilenote {
    text-align: center;
    font-size: 15px;
    margin-top: 6px;
    letter-spacing: 0.2px;
  }
  .fb-title {
    text-align: center;
    font-size: 24px;
    font-weight: 600;
    margin-top: 10px;
  }
  .fb-header.compact .fb-title {
    margin-top: -18px;
  }
  .fb-header.compact .fb-profilenote {
    display: none;
  }

  .fb-tabs {
    display: flex;
    margin-top: 14px;
  }
  .fb-tab {
    flex: 1;
    background: none;
    border: none;
    color: rgba(255,255,255,0.72);
    font-size: 13.5px;
    font-family: inherit;
    padding: 8px 0 9px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
  }
  .fb-tab.active {
    color: #fff;
    font-weight: 700;
    border-bottom-color: #fff;
  }

  .fb-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 14px 10px calc(120px + env(safe-area-inset-bottom));
  }
  .fb-scroll::-webkit-scrollbar { width: 0; }

  .fb-card {
    position: relative;
    background: #fff;
    border-radius: 16px;
    padding: 22px 18px 14px;
    margin-bottom: 22px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.13);
  }
  .fb-idbadge {
    position: absolute;
    top: 0;
    right: 0;
    background: #7B2E9B;
    color: #fff;
    font-size: 12px;
    padding: 5px 14px 6px;
    border-top-right-radius: 16px;
    border-bottom-left-radius: 16px;
  }
  .fb-name {
    font-size: 20px;
    color: #1a1a1a;
    letter-spacing: 0.3px;
    font-weight: 600;
  }
  .fb-room {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15.5px;
    color: #3b3b3b;
    letter-spacing: 0.4px;
    margin-top: 10px;
  }
  .fb-room svg { flex: none; }
  .fb-label {
    font-size: 12.5px;
    color: #9a9a9a;
    margin-top: 14px;
  }
  .fb-value {
    font-size: 16.5px;
    color: #1a1a1a;
    letter-spacing: 0.4px;
    margin-top: 2px;
  }
  .fb-muted { color: #9a9a9a; font-size: 14px; }

  .fb-urgent {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 15px;
    color: #1a1a1a;
    margin-top: 16px;
  }
  .fb-siren { font-size: 16px; }

  .fb-mentor {
    font-size: 15.5px;
    color: #1a1a1a;
    margin-top: 14px;
  }
  .fb-parent {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 13.5px;
    color: #9a9a9a;
    margin-top: 12px;
  }
  .fb-chip {
    background: #b9f6ca;
    color: #1b5e20;
    font-size: 12.5px;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .fb-actionrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 14px;
  }
  .fb-track {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    background: #2196F3;
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 14px 10px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
  }
  .fb-sharebtn {
    background: none;
    border: none;
    padding: 6px;
    cursor: pointer;
    display: flex;
  }

  .fb-created {
    text-align: right;
    font-size: 13px;
    color: #9a9a9a;
    margin-top: 16px;
  }

  .fb-fab {
    position: absolute;
    left: 16px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    width: 54px;
    height: 54px;
    border-radius: 50%;
    background: #2196F3;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 6;
  }
  .fb-sort {
    position: absolute;
    right: 16px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    display: flex;
    align-items: center;
    gap: 9px;
    background: #2196F3;
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 15px 24px;
    font-size: 16.5px;
    font-family: inherit;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
    cursor: pointer;
    z-index: 6;
  }
</style>
</head>
<body>

<div class="fb-root">
  <div class="fb-header" id="fbHeader">
    <div class="fb-toprow">
      <button class="fb-iconbtn" type="button" aria-label="Back">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="20" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <button class="fb-iconbtn" type="button" aria-label="Refresh">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10" />
          <polyline points="1 20 1 14 7 14" />
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
        </svg>
      </button>
    </div>

    <div class="fb-profilenote">Profile Image not set</div>

    <div class="fb-title">My Vacations</div>

    <div class="fb-tabs" id="fbTabs">
      <button type="button" class="fb-tab active" data-tab="Pending">Pending</button>
      <button type="button" class="fb-tab" data-tab="Approved">Approved</button>
      <button type="button" class="fb-tab" data-tab="Expired">Expired</button>
      <button type="button" class="fb-tab" data-tab="Completed">Completed</button>
      <button type="button" class="fb-tab" data-tab="Rej/Can">Rej/Can</button>
    </div>
  </div>

  <div class="fb-scroll" id="fbScroll"></div>

  <button class="fb-fab" type="button" aria-label="Reload">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="23 4 23 10 17 10" />
      <polyline points="1 20 1 14 7 14" />
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
    </svg>
  </button>

  <button class="fb-sort" type="button">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">
      <line x1="4" y1="7" x2="20" y2="7" />
      <line x1="4" y1="12" x2="15" y2="12" />
      <line x1="4" y1="17" x2="10" y2="17" />
    </svg>
    <span>Sort</span>
  </button>
</div>

<script>
  var VACATIONS = [
    {
      id: "22480",
      name: "Sourya Basak",
      room: "QC 19, House F \u2013 5F-242",
      reason: "Other",
      description: "GOING HOME",
      duration: "2 days.",
      from: "Sep 19",
      to: "Sep 20",
      urgent: "No",
      mentor: "APPROVED",
      parentStatus: "Approved",
      parentAt: "At 17 Sep 03:30 AM",
      createdAt: "17/09/2025"
    },
    {
      id: "53459",
      name: "Sourya Basak",
      room: "QC 19, House F \u2013 5F-242",
      reason: "Other",
      description: "VISITING HOME",
      duration: "6 days.",
      from: "Mar 13",
      to: "Mar 18",
      urgent: "No",
      mentor: "APPROVED",
      parentStatus: "Approved",
      parentAt: "At 12 Mar 02:34 PM",
      createdAt: "12/03/2026"
    }
  ];

  var buildingIcon =
    '<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#3b3b3b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="4" y="2" width="16" height="20" rx="1" />' +
    '<rect x="7.6" y="5" width="2.2" height="2.2" fill="#3b3b3b" stroke="none" />' +
    '<rect x="14.2" y="5" width="2.2" height="2.2" fill="#3b3b3b" stroke="none" />' +
    '<rect x="7.6" y="9.5" width="2.2" height="2.2" fill="#3b3b3b" stroke="none" />' +
    '<rect x="14.2" y="9.5" width="2.2" height="2.2" fill="#3b3b3b" stroke="none" />' +
    '<rect x="7.6" y="14" width="2.2" height="2.2" fill="#3b3b3b" stroke="none" />' +
    '<rect x="14.2" y="14" width="2.2" height="2.2" fill="#3b3b3b" stroke="none" />' +
    '<path d="M10 22v-4h4v4" /></svg>';

  var trackIcon =
    '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
    '<polyline points="2 16 7 9 11 13 16 5 22 11" /></svg>';

  var shareIcon =
    '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#1E9BF0" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="18" cy="5" r="2.6" /><circle cx="6" cy="12" r="2.6" /><circle cx="18" cy="19" r="2.6" />' +
    '<line x1="8.3" y1="10.8" x2="15.7" y2="6.2" /><line x1="8.3" y1="13.2" x2="15.7" y2="17.8" /></svg>';

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function renderCard(v) {
    return (
      '<div class="fb-card">' +
        '<div class="fb-idbadge">ID: ' + escapeHtml(v.id) + '</div>' +
        '<div class="fb-name">' + escapeHtml(v.name) + '</div>' +
        '<div class="fb-room">' + buildingIcon + '<span>' + escapeHtml(v.room) + '</span></div>' +
        '<div class="fb-label">Reason</div>' +
        '<div class="fb-value">' + escapeHtml(v.reason) + '</div>' +
        '<div class="fb-label">Description</div>' +
        '<div class="fb-value">' + escapeHtml(v.description) + '</div>' +
        '<div class="fb-label">Duration</div>' +
        '<div class="fb-value">' + escapeHtml(v.duration) +
          ' <span class="fb-muted">From</span> ' + escapeHtml(v.from) +
          ' <span class="fb-muted">To</span> ' + escapeHtml(v.to) + '</div>' +
        '<div class="fb-urgent"><span class="fb-siren">\uD83D\uDEA8</span><span>Urgent? : ' + escapeHtml(v.urgent) + '</span></div>' +
        '<div class="fb-mentor"><span class="fb-muted">Mentor Approval:</span> ' + escapeHtml(v.mentor) + '</div>' +
        '<div class="fb-parent"><span>Parent\'s Permission</span><span class="fb-chip">' + escapeHtml(v.parentStatus) + '</span><span>(' + escapeHtml(v.parentAt) + ')</span></div>' +
        '<div class="fb-actionrow">' +
          '<button class="fb-track" type="button">' + trackIcon + '<span>Track Whatsapp Notification</span></button>' +
          '<button class="fb-sharebtn" type="button" aria-label="Share">' + shareIcon + '</button>' +
        '</div>' +
        '<div class="fb-created">Created At: ' + escapeHtml(v.createdAt) + '</div>' +
      '</div>'
    );
  }

  var scrollEl = document.getElementById("fbScroll");
  scrollEl.innerHTML = VACATIONS.map(renderCard).join("");

  var tabsEl = document.getElementById("fbTabs");
  tabsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".fb-tab");
    if (!btn) return;
    tabsEl.querySelectorAll(".fb-tab").forEach(function (t) {
      t.classList.remove("active");
    });
    btn.classList.add("active");
  });

  var headerEl = document.getElementById("fbHeader");
  scrollEl.addEventListener("scroll", function () {
    if (scrollEl.scrollTop > 8) {
      headerEl.classList.add("compact");
    } else {
      headerEl.classList.remove("compact");
    }
  });
</script>

</body>
</html>
